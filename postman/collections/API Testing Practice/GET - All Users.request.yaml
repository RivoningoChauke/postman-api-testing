$kind: http-request
url: https://jsonplaceholder.typicode.com/users
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time is below 5000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      });\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"API returns 10 users\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.have.lengthOf(10);\r

      });\r

      \r

      pm.test(\"Every user has an ID\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.forEach(function (user) {\r

      \        pm.expect(user).to.have.property(\"id\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Every user has an email\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    response.forEach(function (user) {\r

      \        pm.expect(user).to.have.property(\"email\");\r

      \    });\r

      });"
    language: text/javascript
order: 1000
