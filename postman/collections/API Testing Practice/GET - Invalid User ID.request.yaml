$kind: http-request
url: https://jsonplaceholder.typicode.com/users/999999
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Response time is below 5000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      });\r

      \r

      pm.test(\"Response body is valid JSON\", function () {\r

      \    pm.expect(function () {\r

      \        pm.response.json();\r

      \    }).to.not.throw();\r

      });\r

      \r

      pm.test(\"Response body is an empty object\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.be.an(\"object\");\r

      \    pm.expect(Object.keys(response)).to.have.lengthOf(0);\r

      });\r\n"
    language: text/javascript
order: 3000
