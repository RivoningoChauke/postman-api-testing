$kind: http-request
url: https://jsonplaceholder.typicode.com/posts
method: POST
body:
  type: json
  content: "{\r

    \    \"title\": \"Testing POST without body\",\r

    \    \"userId\": 1\r

    }"
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Status code is 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Body field is missing\", function () {\r

      \    pm.expect(response).to.not.have.property(\"body\");\r

      });\r

      \r

      pm.test(\"Title is returned correctly\", function () {\r

      \    pm.expect(response.title).to.eql(\"Testing POST without body\");\r

      });\r

      \r

      pm.test(\"User ID is correct\", function () {\r

      \    pm.expect(response.userId).to.eql(1);\r

      });\r

      \r

      pm.test(\"Generated ID is a number\", function () {\r

      \    pm.expect(response.id).to.be.a(\"number\");\r

      });"
    language: text/javascript
order: 6000
