$kind: http-request
url: https://jsonplaceholder.typicode.com/posts
method: POST
body:
  type: json
  content: "{\r

    \    \"title\": \"Testing POST without User ID\",\r

    \    \"body\": \"Testing a request with no user ID\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"User ID is missing\", function () {\r

      \    pm.expect(response).to.not.have.property(\"userId\");\r

      });\r

      \r

      pm.test(\"Title is returned correctly\", function () {\r

      \    pm.expect(response.title).to.eql(\"Testing POST without User ID\");\r

      });\r

      \r

      pm.test(\"Body is returned correctly\", function () {\r

      \    pm.expect(response.body).to.eql(\"Testing a request with no user ID\");\r

      });\r

      \r

      pm.test(\"Generated ID is a number\", function () {\r

      \    pm.expect(response.id).to.be.a(\"number\");\r

      });"
    language: text/javascript
order: 7000
